name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["data/**", "**.md"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-inter
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Python tests
        run: npm run test:py
      - name: TypeScript tests (incl. a short real Remotion render)
        run: npm test
