name: Produce video

# Renders one selected candidate into a finished TikTok edit and uploads it as a
# downloadable artifact for your review. Nothing is ever published automatically.
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Candidate id (e.g. local_my-clip) OR a file in references/raw-examples/ (e.g. references/raw-examples/clip.mp4)'
        required: true
      variant:
        description: 'Outro variant (A, B, C, D) – empty = configured default'
        required: false
        default: ''
      hook:
        description: 'Optional hook text shown at the start'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: kindness-ai-data
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-inter
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: Produce
        run: |
          SRC="${{ inputs.source }}"
          if [ -f "$SRC" ]; then
            ID=$(npm run -s kai -- import "$SRC" | sed -n 's/.*imported as //p; s/.*already known as \([^ ]*\).*/\1/p' | tail -1)
          else
            ID="$SRC"
          fi
          echo "candidate: $ID"
          [ -n "${{ inputs.hook }}" ] && npm run -s kai -- set "$ID" --hook "${{ inputs.hook }}"
          VARIANT=""
          [ -n "${{ inputs.variant }}" ] && VARIANT="--variant ${{ inputs.variant }}"
          npm run -s kai -- produce "$ID" $VARIANT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kindness-edit
          path: |
            output/**/final.mp4
            output/**/final.qc.json
            data/jobs/**/plan.json
      - name: Commit pipeline state
        if: always()
        run: |
          git config user.name "kindness-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: production run $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
