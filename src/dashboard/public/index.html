<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kindness AI Kandidaten</title>
<style>
:root {
  --bg: #f6f4ef; --panel: #ffffff; --ink: #1d1b16; --muted: #6b665c; --line: #e4dfd3;
  --accent: #b7791f; --accent-ink: #ffffff; --good: #2f7d4f; --mid: #b7791f; --low: #8a8478; --bad: #b4413b;
  --chip: #efe9dc; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14130f; --panel: #1d1b17; --ink: #f1ede4; --muted: #a39d90; --line: #33302a;
    --accent: #e0a542; --accent-ink: #1a1408; --good: #5bbf84; --mid: #e0a542; --low: #8f897c; --bad: #e0716a;
    --chip: #2a2722; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #14130f; --panel: #1d1b17; --ink: #f1ede4; --muted: #a39d90; --line: #33302a;
  --accent: #e0a542; --accent-ink: #1a1408; --good: #5bbf84; --mid: #e0a542; --low: #8f897c; --bad: #e0716a;
  --chip: #2a2722; --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 20px 16px 8px; max-width: 1280px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.3px; }
.sub { color: var(--muted); font-size: 13px; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 6px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 96px; }
.stat b { display: block; font-size: 20px; }
.stat span { color: var(--muted); font-size: 12px; }
.toolbar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.toolbar .in { max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px; }
.tab.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
select, input[type=search] { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
input[type=search] { min-width: 180px; flex: 1; }
label.chk { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
main { max-width: 1280px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.thumb { position: relative; aspect-ratio: 16/9; background: #000 center/cover no-repeat; }
.thumb .score { position: absolute; top: 10px; left: 10px; font-weight: 800; font-size: 20px; padding: 4px 10px; border-radius: 10px; color: #fff; }
.thumb .level { position: absolute; top: 12px; right: 10px; font-size: 11px; padding: 3px 8px; border-radius: 999px; background: rgba(0,0,0,.65); color: #fff; }
.thumb .dur { position: absolute; bottom: 8px; right: 8px; font-size: 12px; padding: 2px 6px; border-radius: 6px; background: rgba(0,0,0,.7); color: #fff; }
.thumb .fav { position: absolute; bottom: 8px; left: 8px; font-size: 18px; }
.body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.title { font-weight: 650; line-height: 1.3; }
.meta { color: var(--muted); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.meta a { color: var(--accent); }
.desc { color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bars { display: grid; grid-template-columns: 22px 1fr 44px; gap: 4px 8px; align-items: center; font-size: 12px; }
.bar { height: 7px; background: var(--chip); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--ink); }
.pill.state { font-weight: 600; }
.pills { display: flex; gap: 4px; flex-wrap: wrap; }
details { font-size: 12px; color: var(--muted); }
details li { margin: 2px 0; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
button.a { font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
button.a.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.a:hover { filter: brightness(.96); }
.media-note { font-size: 12px; border-left: 3px solid var(--line); padding-left: 8px; color: var(--muted); }
.media-note.ok { border-color: var(--good); }
.media-note.warn { border-color: var(--mid); }
video { width: 100%; border-radius: 10px; background: #000; max-height: 520px; }
.empty { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 60px 0; }
.banner { max-width: 1280px; margin: 8px auto 0; padding: 10px 16px; font-size: 13px; color: var(--muted); }
.banner b { color: var(--ink); }
@media (max-width: 520px) { main { grid-template-columns: 1fr; padding: 12px; } header { padding: 16px 12px 4px; } }
</style>
</head>
<body>
<header>
  <h1>Kindness AI · Kandidaten</h1>
  <div class="sub" id="sub">lädt …</div>
  <div class="stats" id="stats"></div>
</header>
<div class="toolbar"><div class="in">
  <div class="tabs" id="tabs"></div>
  <input type="search" id="q" placeholder="Suchen (Titel, Kanal, Kategorie) …">
  <select id="cat"><option value="">Alle Kategorien</option></select>
  <select id="sort">
    <option value="score">Sortieren: Bewertung</option>
    <option value="new">Sortieren: Neueste</option>
    <option value="dur">Sortieren: Dauer</option>
  </select>
  <label class="chk"><input type="checkbox" id="favOnly"> nur Favoriten</label>
  <label class="chk"><input type="checkbox" id="hideRejected" checked> Abgelehnte ausblenden</label>
</div></div>
<div class="banner" id="banner"></div>
<main id="grid"></main>
<script>
const INLINE = /*__DATA__*/null;
const STATIC = !!INLINE;
const LEVEL = { METADATA_ONLY: 'vorläufig · nur Metadaten', CONTENT_SIGNALS: 'Video technisch analysiert', CONTENT_REVIEWED: 'Inhalt bewertet' };
const STATE_DE = {
  DISCOVERED: 'Gefunden', METADATA_ANALYZED: 'Metadaten', CONTENT_ANALYZED: 'Inhalt analysiert', SCORED: 'Bewertet',
  SHORTLISTED: 'Shortlist', SELECTED: 'Für Produktion', EDITING: 'Im Schnitt', RENDERED: 'Gerendert', QUALITY_CHECKED: 'QC bestanden',
  REVIEW: 'Wartet auf Freigabe', APPROVED: 'Freigegeben', EXPORTED: 'Exportiert', MEDIA_UNAVAILABLE: 'Material fehlt',
  ANALYSIS_FAILED: 'Analyse fehlgeschlagen', RENDER_FAILED: 'Render fehlgeschlagen', QC_FAILED: 'QC fehlgeschlagen',
  REJECTED: 'Abgelehnt', ARCHIVED: 'Archiv (< 75)'
};
const TABS = [
  ['shortlist', 'Shortlist ≥ 75', c => c.state === 'SHORTLISTED'],
  ['new', 'Neu (7 Tage)', c => Date.now() - new Date(c.discoveredAt) < 7 * 864e5 && !['REJECTED'].includes(c.state)],
  ['selected', 'Für Produktion', c => ['SELECTED','EDITING','RENDERED','QUALITY_CHECKED','MEDIA_UNAVAILABLE','RENDER_FAILED','QC_FAILED'].includes(c.state)],
  ['review', 'Review', c => ['REVIEW','APPROVED','EXPORTED'].includes(c.state)],
  ['archive', 'Archiv < 75', c => c.state === 'ARCHIVED'],
  ['all', 'Alle', c => true],
];
const MEDIA_DE = {
  available: ['ok', 'Videomaterial liegt vor'], downloadable: ['ok', 'Freie Lizenz – automatisch ladbar'],
  manual_required: ['warn', 'Datei muss manuell bereitgestellt werden (media/inbox/)'], metadata_only: ['warn', 'Nur Metadaten'],
  unavailable: ['warn', 'Nicht verfügbar'], unknown: ['', 'Unbekannt']
};
let DATA = null, tab = 'shortlist';
const local = (() => { try { return JSON.parse(localStorage.getItem('kai-actions') || '{}'); } catch { return {}; } })();
const saveLocal = () => { try { localStorage.setItem('kai-actions', JSON.stringify(local)); } catch {} };
try { tab = localStorage.getItem('kai-tab') || tab; } catch {}

const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtDur = s => s == null ? '' : `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
const scoreColor = s => s == null ? 'var(--low)' : s >= 75 ? 'var(--good)' : s >= 60 ? 'var(--mid)' : 'var(--low)';

async function load() {
  DATA = STATIC ? INLINE : await (await fetch('/api/data')).json();
  if (STATIC) for (const c of DATA.candidates) if (local[c.id]) Object.assign(c, local[c.id]);
  render();
}

function render() {
  const cands = DATA.candidates;
  document.getElementById('sub').textContent = `${cands.length} Kandidaten · Stand ${new Date(DATA.generatedAt).toLocaleString('de-DE')} · Schwelle ${DATA.threshold} Punkte` + (STATIC ? ' · Snapshot (Aktionen werden im Browser gespeichert)' : '');
  const count = f => cands.filter(f).length;
  document.getElementById('stats').innerHTML = [
    ['Shortlist', count(c => c.state === 'SHORTLISTED')], ['Für Produktion', count(c => c.state === 'SELECTED')],
    ['Review', count(c => c.state === 'REVIEW')], ['Favoriten', count(c => c.favorite)], ['Archiv', count(c => c.state === 'ARCHIVED')],
  ].map(([l, n]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
  document.getElementById('tabs').innerHTML = TABS.map(([id, label, f]) => `<button class="tab ${id === tab ? 'on' : ''}" data-tab="${id}">${label} · ${count(f)}</button>`).join('');
  const cats = [...new Set(cands.flatMap(c => c.categories || []))].sort();
  const catSel = document.getElementById('cat'); const cur = catSel.value;
  catSel.innerHTML = '<option value="">Alle Kategorien</option>' + cats.map(c => `<option ${c === cur ? 'selected' : ''}>${esc(c)}</option>`).join('');
  const ld = DATA.lastDiscovery;
  document.getElementById('banner').innerHTML = ld ? `<b>Letzte Suche:</b> ${new Date(ld.at).toLocaleString('de-DE')} · ${ld.added.length} neu · ` +
    Object.entries(ld.perAdapter).map(([k, v]) => `${k}: ${v.hits} Treffer${v.blocked ? ' (gesperrt)' : ''}`).join(' · ') : '';
  const q = document.getElementById('q').value.toLowerCase();
  const cat = catSel.value;
  const favOnly = document.getElementById('favOnly').checked;
  const hideRej = document.getElementById('hideRejected').checked;
  const f = TABS.find(t => t[0] === tab)[2];
  let list = cands.filter(f).filter(c => (!favOnly || c.favorite) && (!hideRej || c.state !== 'REJECTED') && (!cat || (c.categories || []).includes(cat)))
    .filter(c => !q || `${c.title} ${c.channel} ${(c.categories || []).join(' ')} ${c.platform}`.toLowerCase().includes(q));
  const sort = document.getElementById('sort').value;
  list.sort((a, b) => sort === 'new' ? new Date(b.discoveredAt) - new Date(a.discoveredAt) : sort === 'dur' ? (a.durationSec ?? 1e9) - (b.durationSec ?? 1e9) : (b.score?.total ?? -1) - (a.score?.total ?? -1));
  const grid = document.getElementById('grid');
  grid.innerHTML = list.length ? list.map(card).join('') : '<div class="empty">Keine Kandidaten in dieser Ansicht.</div>';
}

function card(c) {
  const s = c.score;
  const keys = ['emotional', 'clarity', 'dropPotential', 'visualQuality', 'originality'];
  const letters = ['A', 'B', 'C', 'D', 'E'];
  const bars = s ? keys.map((k, i) => `<span title="${esc(DATA.rubric[k].label)}">${letters[i]}</span><div class="bar"><i style="width:${(s[k].points / s[k].max * 100).toFixed(0)}%"></i></div><span>${s[k].points}/${s[k].max}</span>`).join('') : '';
  const reasons = s ? keys.map((k, i) => `<li><b>${letters[i]}</b> ${esc(s[k].reasons.join(' · '))}</li>`).join('') : '';
  const [mcls, mtxt] = MEDIA_DE[c.media?.status] || ['', c.media?.status];
  const prod = (DATA.productions || []).find(p => p.jobId === c.jobId);
  const video = !STATIC && prod?.output && ['REVIEW','APPROVED','EXPORTED','QC_FAILED'].includes(c.state) ? `<video controls preload="metadata" src="/video/${esc(prod.output.replace(/^output\//, ''))}"></video>` : '';
  const btn = (act, label, primary) => `<button class="a ${primary ? 'primary' : ''}" data-act="${act}" data-id="${esc(c.id)}">${label}</button>`;
  const buttons = [
    btn(c.favorite ? 'unfavorite' : 'favorite', c.favorite ? '★ Favorit' : '☆ Favorit'),
    ['SHORTLISTED', 'SCORED', 'ARCHIVED', 'REJECTED', 'METADATA_ANALYZED', 'CONTENT_ANALYZED'].includes(c.state) ? btn('select', 'Für Produktion auswählen', true) : '',
    c.state === 'REVIEW' ? btn('approve', 'Video freigeben', true) : '',
    !['REJECTED', 'EXPORTED'].includes(c.state) ? btn('reject', 'Ablehnen') : '',
    c.state === 'ARCHIVED' || c.state === 'REJECTED' ? btn('restore', 'Wiederherstellen') : (['SHORTLISTED', 'SCORED'].includes(c.state) ? btn('archive', 'Archivieren') : ''),
  ].join('');
  return `<article class="card">
    <div class="thumb" style="background-image:url('${esc(c.thumbnailUrl || '')}')">
      <span class="score" style="background:${scoreColor(s?.total)}">${s ? Math.round(s.total) : '–'}</span>
      ${s ? `<span class="level">${LEVEL[s.analysisLevel] || s.analysisLevel}</span>` : ''}
      ${c.durationSec ? `<span class="dur">${fmtDur(c.durationSec)}</span>` : ''}
      ${c.favorite ? '<span class="fav">★</span>' : ''}
    </div>
    <div class="body">
      <div class="title">${esc(c.title)}</div>
      <div class="meta"><span>${esc(c.platform)}${c.channel ? ' · ' + esc(c.channel) : ''}</span>${c.viewCount ? `<span>${Number(c.viewCount).toLocaleString('de-DE')} Aufrufe</span>` : ''}<a href="${esc(c.url)}" target="_blank" rel="noopener">Original öffnen ↗</a></div>
      ${c.description ? `<div class="desc">${esc(c.description)}</div>` : ''}
      <div class="pills"><span class="pill state">${STATE_DE[c.state] || c.state}</span>${(c.categories || []).map(x => `<span class="pill">${esc(x)}</span>`).join('')}${c.isCompilation ? '<span class="pill">Compilation</span>' : ''}</div>
      ${bars ? `<div class="bars">${bars}</div>` : ''}
      ${reasons ? `<details><summary>Begründung</summary><ul>${reasons}</ul></details>` : ''}
      <div class="media-note ${mcls}">${esc(mtxt)}${c.media?.reason && c.media.status !== 'available' ? ' – ' + esc(c.media.reason) : ''}</div>
      ${c.lastError ? `<div class="media-note warn">Fehler (${esc(c.lastError.step)}): ${esc(c.lastError.message)}</div>` : ''}
      ${video}
      <div class="actions">${buttons}</div>
    </div>
  </article>`;
}

async function act(id, action) {
  if (STATIC) {
    const c = DATA.candidates.find(x => x.id === id);
    const patch = local[id] || (local[id] = {});
    if (action === 'favorite' || action === 'unfavorite') patch.favorite = c.favorite = action === 'favorite';
    else patch.state = c.state = { select: 'SELECTED', reject: 'REJECTED', archive: 'ARCHIVED', restore: 'SHORTLISTED', approve: 'APPROVED' }[action];
    saveLocal(); render(); return;
  }
  const r = await fetch(`/api/candidates/${encodeURIComponent(id)}/${action}`, { method: 'POST' });
  if (!r.ok) alert((await r.json()).error || 'Fehler');
  await load();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (t) { tab = t.dataset.tab; try { localStorage.setItem('kai-tab', tab); } catch {} render(); return; }
  const b = e.target.closest('[data-act]');
  if (b) act(b.dataset.id, b.dataset.act);
});
for (const id of ['q', 'cat', 'sort', 'favOnly', 'hideRejected']) document.getElementById(id).addEventListener('input', render);
load().catch(err => { document.getElementById('sub').textContent = 'Daten konnten nicht geladen werden: ' + err.message; });
</script>
</body>
</html>
